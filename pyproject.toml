[project]
name = "buildscope"
version = "0.1.0"
description = "Municipal building-permit data pipeline with measured LLM extractor synthesis"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["permits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Adopted on a codebase that predates it, so the rule set is explicit and
# ratchets down rather than being switched on all at once - the same shape as
# the import allowlist in tests/test_structure.py. What is selected here is
# correctness and import hygiene; what is deferred is a repo-wide style
# modernization (`%`-formatting, `io.open`, `class X(object)`, encoding
# declarations) that touches 75 files and should be one reviewable change, not
# a diff smeared through unrelated work. Entries may leave `ignore`, not join
# it.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "RUF"]
ignore = [
    "RUF046",  # int() on a ceil() result: explicit about the intent
    "RUF100",  # per-file-ignores make the `# noqa: E402` comments look
               # unused; they still document why the import is where it is,
               # and stripping 20 of them is churn, not a fix.
]

[tool.ruff.lint.per-file-ignores]
# Scripts insert ROOT on sys.path before importing `permits`, so their imports
# cannot be sorted to the top. That is the boundary ADR-0016 describes, not a
# style problem.
"scripts/*.py" = ["E402", "I001"]
"tests/*.py" = ["E402", "I001"]
