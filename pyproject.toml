[project]
name = "buildscope"
version = "0.1.0"
description = "Municipal building-permit data pipeline with measured LLM extractor synthesis"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx2>=2.0",
    "openai>=1.40",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["permits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Adopted on a codebase that predates it, so the rule set is explicit and
# ratchets down rather than being switched on all at once - the same shape as
# the import allowlist in tests/test_structure.py. What is selected here is
# correctness and import hygiene; what is deferred is a repo-wide style
# modernization (`%`-formatting, `io.open`, `class X(object)`, encoding
# declarations) that touches 75 files and should be one reviewable change, not
# a diff smeared through unrelated work. Entries may leave `ignore`, not join
# it.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "RUF"]
ignore = [
    "RUF046",  # int() on a ceil() result: explicit about the intent
    "RUF100",  # per-file-ignores make the `# noqa: E402` comments look
               # unused; they still document why the import is where it is,
               # and stripping 20 of them is churn, not a fix.
]

[tool.ruff.lint.per-file-ignores]
# Scripts and spikes insert ROOT on sys.path before importing `permits`, so
# their imports cannot be sorted to the top: the bootstrap is what makes the
# package importable, and hoisting the import above it breaks the file. A
# style problem would be worth fixing; this is load-bearing ordering.
"scripts/*.py" = ["E402", "I001"]
# RUF012: the test doubles are two-line stub classes declared inside the test
# that uses them. A ClassVar annotation on a throwaway is ceremony, not safety.
"tests/*.py" = ["E402", "I001", "RUF012"]
# The lab notebook is unmaintained by definition (see spikes/README.md), and
# these rules all flag the signature of exploratory code: a tuple unpacked for
# one of its fields, a loop index kept for readability, a variable assigned
# while working something out. Rewriting 47 abandoned scripts to satisfy them
# would risk changing what produced the published numbers, for no reader's
# benefit. Correctness rules (F, E7, E9) still apply here.
"spikes/*.py" = ["E402", "I001", "RUF059", "B007", "B023", "F841", "E741",
                 "E731", "RUF005"]

# Type-checked file by file, starting from the inference layer: step 1 of
# docs/evidence/2026-09-26-model-comparison-fairness-audit.md. `files` is the
# checked set. A file joins it once it passes under `strict`, and none leaves -
# the same ratchet as the ruff rule set above.
[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "permits/cells.py",
    "permits/infer.py",
    "permits/models.py",
    "permits/stats.py",
    "permits/telemetry.py",
]

# The OTLP exporter is an optional extra (`uv sync --extra otlp`) and is not
# installed in CI.
[[tool.mypy.overrides]]
module = ["opentelemetry.exporter.*"]
ignore_missing_imports = true
