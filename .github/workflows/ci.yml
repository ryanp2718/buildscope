name: CI

# The suite replays over stored pages and makes no network calls, so this
# needs no secrets and cannot spend money. What it cannot do is run the ~28
# tests that read the private raw store; those skip here and run locally.
# See tests/__init__.py and ADR-0015.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml, 3.13 is what the
        # project is developed on. Testing both is what makes the floor a
        # claim rather than a guess.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        # Strict, on the files listed under [tool.mypy] in pyproject.toml.
        # The list grows file by file and never shrinks.
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

      - name: Check the docs
        # The ADR index matches the files on disk, statuses come from the
        # permitted vocabulary, every relative link inside docs/ resolves, and
        # every evidence report names a producer and a non-empty
        # "What this does not establish".
        run: uv run python scripts/check_docs.py

  render:
    # The results page in a real browser (tests/test_render.py): script
    # errors, mark counts against data.json, text off the screen, a page wider
    # than a phone. Its own job because it is the one check that needs the
    # network, for the page's CDN script and fonts. The screenshots are kept
    # as an artifact, for the look a count cannot give.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --group render --python 3.13

      - name: Install the browser
        run: uv run playwright install --with-deps chromium

      - name: Render the results page
        env:
          RENDER_CHECK: "1"
          RENDER_SHOTS: render-shots
        run: uv run pytest -q tests/test_render.py

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-shots
          path: render-shots/
          if-no-files-found: ignore
